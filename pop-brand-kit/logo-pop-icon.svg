<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="POP! app icon">
  <!-- POP! app icon · use from 1024px down to 180px -->
  <defs>
    <linearGradient id="popbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3F8E"/>
      <stop offset="1" stop-color="#FF6B2C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#popbg)"/>
  <g fill="none" stroke="#FFF4E4" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <!-- bubble -->
    <circle cx="240" cy="290" r="104"/>
    <!-- bubble highlight -->
    <circle cx="204" cy="256" r="14" fill="#FFF4E4" stroke="none"/>
    <!-- fizz -->
    <circle cx="362" cy="190" r="26"/>
    <circle cx="312" cy="116" r="16"/>
  </g>
  <!-- little smile inside the bubble -->
  <path d="M196 316q44 40 88 0" fill="none" stroke="#FFF4E4" stroke-width="26" stroke-linecap="round"/>
</svg>
